  <title>Dott Bikes — Mons</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    #map { height: 100%; width: 100%; }

    .leaflet-tooltip {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 13px;
      box-shadow: 0 1px 4px rgba(0,0,0,.15);
    }

    .title-bar {
      position: absolute; top: 20px; left: 0; right: 0; z-index: 1000;
      background: rgba(255,255,255,.92);
      padding: 10px 16px;
      box-shadow: 0 1px 6px rgba(0,0,0,.2);
      font-size: 14px; line-height: 1.5;
      text-align: center;
      margin-left: 200px;
      margin-right: 200px;
      zoom: 1.4;
    }
    .title-bar .main  { font-weight: 700; font-size: 15px; }
    .title-bar .sub   { font-size: 13px; color: #555; }
    .legend {
      background: rgba(255,255,255,.95);
      padding: 10px 14px;
      border-radius: 6px;
      box-shadow: 0 1px 6px rgba(0,0,0,.2);
      font-size: 13px;
      line-height: 1.8;
    }
    .legend i {
      display: inline-block;
      width: 14px; height: 14px;
      border-radius: 50%;
      margin-left: 4px;
      margin-right: 6px;
      vertical-align: middle;
    }
    .legend .no-ride    { border-radius: 2px; background: rgba(220,38,38,.2);  border: 2px solid rgba(220,38,38,.6); }
    .legend .speed-zone { border-radius: 2px; background: rgba(234,179,8,.25); border: 2px solid rgba(234,179,8,.6); }
    .legend .rack { border-radius: 2px; background: rgba(139,92,246,.2); border: 2px solid rgba(139,92,246,.6); }
    .legend .boundary   { border-radius: 2px; background: transparent;          border: 2px solid #000; }
  </style>

<body>
  <div id="title" class="title-bar">
    <div class="main">Mons&nbsp;: Le point sur Dott</div>
    <div class="sub">Chargement…</div>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const API = {
      bikes:       'https://gbfs.api.ridedott.com/public/v2/mons/free_bike_status.json',
      geofencing:  'https://gbfs.api.ridedott.com/public/v2/mons/geofencing_zones.json',
      stations:    'https://gbfs.api.ridedott.com/public/v2/mons/station_information.json',
    };

    // ── Map ──────────────────────────────────────────────────────
    const map = L.map('map').setView([50.454, 3.952], 15);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
      maxZoom: 19,
    }).addTo(map);

    // ── Legend (counts injected after data loads) ────────────────
    function buildLegendHTML(nBikes, nStations, nNoRide, nSpeed) {
      return `
        <div><img src="bicycle.png" style="width:22px;height:22px;vertical-align:middle;margin-right:2px"> Vélos <b>(${nBikes})</b></div>
        <div><i style="background:rgba(34,197,94,.85);border:2px solid #16a34a"></i> Stations <b>(${nStations})</b></div>
        <div><i class="no-ride"></i> Zones interdites <b>(${nNoRide})</b></div>
        <div><i class="speed-zone"></i> Zones à vitesse limitée <b>(${nSpeed})</b></div>
      `;
    }

    const legendEl = L.DomUtil.create('div', 'legend');
    legendEl.innerHTML = buildLegendHTML('…', '…', '…', '…');

    const legend = L.control({ position: 'bottomleft' });
    legend.onAdd = () => legendEl;
    legend.addTo(map);

    function updateLegend(nBikes, nStations, nNoRide, nSpeed) {
      legendEl.innerHTML = buildLegendHTML(nBikes, nStations, nNoRide, nSpeed);
    }

    function updateTitle(nGreen, nRed, nInNoRide) {
      document.getElementById('title').querySelector('.sub').innerHTML =
        `<b style="color:#16a34a">${nGreen}</b> vélos bien garés | ` +
        `<b style="color:#dc2626">${nRed}</b> vélos mal garés<br>` +
        `<small>dont <b style="color:#dc2626">${nInNoRide}</b> sur zone interdite</small>`;
    }

    // ── Layer groups ─────────────────────────────────────────────
    const bikeLayer    = L.layerGroup().addTo(map);
    const stationLayer = L.layerGroup().addTo(map);
    const zoneLayer    = L.layerGroup().addTo(map);
    const rackLayer    = L.layerGroup();  // hidden for now

    // ── Fetch & render ───────────────────────────────────────────
    async function loadAll() {
      try {
        const [bikesRes, zonesRes, stationsRes] = await Promise.all([
          fetch(API.bikes),
          fetch(API.geofencing),
          fetch(API.stations),
        ]);

        const bikesData    = await bikesRes.json();
        const zonesData    = await zonesRes.json();
        const stationsData = await stationsRes.json();

        // Extract no-ride zone polygons for bike proximity check
        const noRidePolys = [];
        for (const f of zonesData.data.geofencing_zones.features) {
          const rules = f.properties?.rules || [];
          const hasSpeed = rules.some(r => r.maximum_speed_kph != null);
          if (!hasSpeed && f.properties?.name !== 'Mons') {
            noRidePolys.push(f.geometry);
          }
        }

        const bikeCounts = renderBikes(bikesData.data.bikes, stationsData.data.stations, noRidePolys);
        const { nNoRide, nSpeed } = renderZones(zonesData.data.geofencing_zones);
        renderStations(stationsData.data.stations);

        updateTitle(bikeCounts.nGreen, bikeCounts.nRed, bikeCounts.nInNoRide);
        updateLegend(
          bikesData.data.bikes.length,
          stationsData.data.stations.length,
          nNoRide,
          nSpeed
        );
      } catch (err) {
        console.error('Failed to load Dott data:', err);
        updateLegend('?', '?', '?', '?');
      }
    }

    // ── Bikes ────────────────────────────────────────────────────
    const bikeIconGreen = L.icon({
      iconUrl: 'bicycle-green.png',
      iconSize: [48, 48],
      iconAnchor: [24, 48],
      tooltipAnchor: [0, -48],
    });

    const bikeIconRed = L.icon({
      iconUrl: 'bicycle-red.png',
      iconSize: [48, 48],
      iconAnchor: [24, 48],
      tooltipAnchor: [0, -48],
    });

    // Approx meters per degree at Mons latitude (~50.45°)
    const M_PER_DEG_LAT = 111320;
    const M_PER_DEG_LON = 111320 * Math.cos(50.45 * Math.PI / 180); // ≈ 70950

    function distMeters(a, b) {
      const dlat = (a.lat - b.lat) * M_PER_DEG_LAT;
      const dlon = (a.lon - b.lon) * M_PER_DEG_LON;
      return Math.sqrt(dlat * dlat + dlon * dlon);
    }

    // Point-in-polygon (ray casting) for [lon, lat] coords
    function pointInPolygon(pt, ring) {
      let inside = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const xi = ring[i][0], yi = ring[i][1];
        const xj = ring[j][0], yj = ring[j][1];
        if ((yi > pt.lat) !== (yj > pt.lat) && pt.lon < ((xj - xi) * (pt.lat - yi)) / (yj - yi) + xi) {
          inside = !inside;
        }
      }
      return inside;
    }

    function bikeInNoRideZone(bike, noRidePolys) {
      for (const geom of noRidePolys) {
        // MultiPolygon: array of polygon arrays, each polygon = array of rings
        const polys = geom.type === 'MultiPolygon' ? geom.coordinates : [geom.coordinates];
        for (const poly of polys) {
          if (pointInPolygon(bike, poly[0])) return true;
        }
      }
      return false;
    }

    function renderBikes(bikes, stations, noRidePolys) {
      bikeLayer.clearLayers();
      let nGreen = 0, nRed = 0, nInNoRide = 0;

      for (const b of bikes) {
        let minDist = Infinity;
        for (const s of stations) {
          const d = distMeters(b, s);
          if (d < minDist) minDist = d;
        }
        const farFromStation = minDist > 20;
        const inNoRide = bikeInNoRideZone(b, noRidePolys);
        const isRed = farFromStation || inNoRide;

        if (isRed) nRed++; else nGreen++;
        if (inNoRide) nInNoRide++;

        let status;
        if (b.is_disabled) {
          status = 'Désactivé';
        } else if (b.is_reserved) {
          status = 'Réservé';
        } else {
          status = isRed ? 'Mal garé' : 'Bien garé';
        }

        const marker = L.marker([b.lat, b.lon], {
          icon: isRed ? bikeIconRed : bikeIconGreen,
        });

        const warning = [];
        if (farFromStation) warning.push('loin d\'une station');
        if (inNoRide) warning.push('en zone interdite');

        marker.bindTooltip(
          `<b>${status}</b>${warning.length ? ' ⚠' : ''}<br>ID : ${b.bike_id.slice(0,8)}…<br>Autonomie : ${(b.current_range_meters / 1000).toFixed(1)} km`,
        );

        marker.addTo(bikeLayer);
      }

      return { nGreen, nRed, nInNoRide };
    }

    // ── Geofencing zones ─────────────────────────────────────────
    function renderZones(geojson) {
      zoneLayer.clearLayers();
      let nNoRide = 0, nSpeed = 0, nBoundary = 0;

      for (const feature of geojson.features) {
        const rules = feature.properties?.rules || [];
        const name  = feature.properties?.name;
        const hasSpeedLimit = rules.some(r => r.maximum_speed_kph != null);

        let style, tooltip, opts;

        if (name === 'Mons') {
          nBoundary++;
          style = {
            color: '#000',
            weight: 2,
            fillColor: 'transparent',
            fillOpacity: 0,
          };
          tooltip = 'Zone de service Mons';
          opts = { style, interactive: false };
        } else if (hasSpeedLimit) {
          nSpeed++;
          const kph = rules.find(r => r.maximum_speed_kph != null)?.maximum_speed_kph || '?';
          style = {
            color: '#ca8a04',
            weight: 2,
            fillColor: '#eab308',
            fillOpacity: 0.25,
          };
          tooltip = `⚠ Limite : ${kph} km/h`;
          opts = { style };
        } else {
          nNoRide++;
          style = {
            color: '#dc2626',
            weight: 2,
            fillColor: '#dc2626',
            fillOpacity: 0.2,
          };
          opts = { style };
          const labels = [];
          for (const r of rules) {
            if (!r.ride_allowed) labels.push('Circulation interdite');
            if (!r.ride_through_allowed) labels.push('Traversée interdite');
            if (r.station_parking) labels.push('Stationnement uniquement');
          }
          tooltip = labels.join(' · ') || 'Zone réglementée';
        }

        const layer = L.geoJSON(feature, opts).addTo(zoneLayer);
        layer.bindTooltip(tooltip, {
          direction: 'center',
          className: 'leaflet-tooltip',
        });
      }

      return { nNoRide, nSpeed, nBoundary };
    }

    // ── Stations ─────────────────────────────────────────────────
    function renderStations(stations) {
      stationLayer.clearLayers();
      for (const s of stations) {
        const cap = s.vehicle_capacity?.dott_bicycle ?? 0;

        const marker = L.circle([s.lat, s.lon], {
          radius: 7.5,
          fillColor: '#22c55e',
          color: '#16a34a',
          weight: 2,
          fillOpacity: 0.3,
        });

        marker.bindTooltip(
          `<b>${s.name}</b><br>Capacité : ${cap}`,
          { direction: 'top', offset: [0, 0], opacity: 0.92 }
        );

        marker.addTo(stationLayer);
      }
    }

    function renderRacks(racks) {
      rackLayer.clearLayers();
      for (const r of racks) {
        const cap = r.capacity || '?';
        const marker = L.circleMarker([r.lat, r.lon], {
          radius: 4,
          fillColor: '#8b5cf6',
          color: '#7c3aed',
          weight: 1.5,
          fillOpacity: 0.85,
        });
        marker.bindTooltip(

        );

      return racks.length;
