<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dott Bikes</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    #map { height: 100%; width: 100%; }

    .leaflet-tooltip {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 13px;
      box-shadow: 0 1px 4px rgba(0,0,0,.15);
    }

    .title-bar {
      position: absolute; top: 20px; left: 0; right: 0; z-index: 1000;
      background: rgba(255,255,255,.92);
      padding: 10px 16px;
      box-shadow: 0 1px 6px rgba(0,0,0,.2);
      font-size: 14px; line-height: 1.5;
      text-align: center;
      margin-left: 200px;
      margin-right: 200px;
      zoom: 1.4;
    }
    .title-bar .main  { font-weight: 700; font-size: 15px; }
    .title-bar .sub   { font-size: 13px; color: #555; }

    .city-select {
      position: absolute; top: 20px; left: 16px; z-index: 1001;
      background: rgba(255,255,255,.95);
      padding: 6px 10px;
      border-radius: 6px;
      box-shadow: 0 1px 6px rgba(0,0,0,.2);
      font-size: 14px;
      border: none;
      cursor: pointer;
    }

    .legend {
      background: rgba(255,255,255,.95);
      padding: 10px 14px;
      border-radius: 6px;
      box-shadow: 0 1px 6px rgba(0,0,0,.2);
      font-size: 13px;
      line-height: 1.8;
    }
    .legend i {
      display: inline-block;
      width: 14px; height: 14px;
      border-radius: 50%;
      margin-left: 4px;
      margin-right: 6px;
      vertical-align: middle;
    }
    .legend .no-ride    { border-radius: 2px; background: rgba(220,38,38,.2);  border: 2px solid rgba(220,38,38,.6); }
    .legend .speed-zone { border-radius: 2px; background: rgba(234,179,8,.25); border: 2px solid rgba(234,179,8,.6); }
    .legend .boundary   { border-radius: 2px; background: transparent;          border: 2px solid #000; }

    .github-ribbon {
      position: absolute; top: 0; right: 0; z-index: 2000;
      width: 160px; height: 160px; overflow: hidden;
      pointer-events: none;
    }
    .github-ribbon a {
      position: absolute; top: 32px; right: -42px;
      display: block; width: 190px;
      background: rgba(59,130,246,.85); color: #fff;
      text-align: center; font-size: 12px; font-weight: 700;
      line-height: 28px;
      text-decoration: none;
      transform: rotate(45deg);
      box-shadow: 0 2px 6px rgba(0,0,0,.2);
      pointer-events: auto;
    }
    .github-ribbon a:hover { background: rgba(37,99,235,.9); }
  </style>
</head>
<body>
  <div class="github-ribbon">
    <a href="https://github.com/MichaelHoste/dott-watcher" target="_blank">Fork me on GitHub</a>
  </div>

  <select id="citySelect" class="city-select" style="display: none;">
    <option value="mons">Mons</option>
    <option value="charleroi">Charleroi</option>
    <option value="liege">Liège</option>
    <option value="brussels">Bruxelles</option>
    <option value="aachen">Aix-La-Chapelle</option>
  </select>

  <div id="title" class="title-bar">
    <div class="main">Chargement…</div>
    <div class="sub"></div>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ── City configuration ───────────────────────────────────────
    const CITIES = {
      mons:      { name: 'Mons',             center: [50.454, 3.952],  zoom: 15, boundaryName: 'Mons' },
      charleroi: { name: 'Charleroi',        center: [50.411, 4.444],  zoom: 13, boundaryName: 'Charleroi' },
      liege:     { name: 'Liège',            center: [50.641, 5.571],  zoom: 13, boundaryName: 'Liege' },
      brussels:  { name: 'Bruxelles',        center: [50.847, 4.352],  zoom: 13, boundaryName: 'Brussels' },
    };

    function apiUrl(city, feed) {
      return `https://gbfs.api.ridedott.com/public/v2/${city}/${feed}.json`;
    }

    let currentCity = 'mons';

    // ── Map ──────────────────────────────────────────────────────
    const map = L.map('map').setView([50.454, 3.952], 15);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
      maxZoom: 19,
    }).addTo(map);

    // ── Legend ───────────────────────────────────────────────────
    function buildLegendHTML(nBikes, nStations, nNoRide, nSpeed) {
      return `
        <div><img src="bicycle.png" style="width:22px;height:22px;vertical-align:middle;margin-right:2px"> Vélos <b>(${nBikes})</b></div>
        <div><i style="background:rgba(34,197,94,.85);border:2px solid #16a34a"></i> Stations <b>(${nStations})</b></div>
        <div><i class="no-ride"></i> Zones interdites <b>(${nNoRide})</b></div>
        <div><i class="speed-zone"></i> Zones à vitesse limitée <b>(${nSpeed})</b></div>
      `;
    }

    const legendEl = L.DomUtil.create('div', 'legend');
    legendEl.innerHTML = buildLegendHTML('…', '…', '…', '…');

    const legend = L.control({ position: 'bottomleft' });
    legend.onAdd = () => legendEl;
    legend.addTo(map);

    function updateLegend(nBikes, nStations, nNoRide, nSpeed) {
      legendEl.innerHTML = buildLegendHTML(nBikes, nStations, nNoRide, nSpeed);
    }

    function updateTitle(cityName, nGreen, nRed, nInNoRide) {
      document.getElementById('title').querySelector('.main').textContent =
        cityName + ' : Le point sur Dott';
      document.getElementById('title').querySelector('.sub').innerHTML =
        `<b style="color:#16a34a">${nGreen}</b> vélos bien garés | ` +
        `<b style="color:#dc2626">${nRed}</b> vélos mal garés<br>` +
        `<small>dont <b style="color:#dc2626">${nInNoRide}</b> sur zone interdite</small>`;
    }

    // ── Layer groups ─────────────────────────────────────────────
    const bikeLayer    = L.layerGroup().addTo(map);
    const stationLayer = L.layerGroup().addTo(map);
    const zoneLayer    = L.layerGroup().addTo(map);
    const rackLayer    = L.layerGroup();  // hidden for now

    // ── Icons ────────────────────────────────────────────────────
    const bikeIconGreen = L.icon({
      iconUrl: 'bicycle-green.png',
      iconSize: [48, 48],
      iconAnchor: [24, 48],
      tooltipAnchor: [0, -48],
    });

    const bikeIconRed = L.icon({
      iconUrl: 'bicycle-red.png',
      iconSize: [48, 48],
      iconAnchor: [24, 48],
      tooltipAnchor: [0, -48],
    });

    // ── Geo helpers ──────────────────────────────────────────────
    function distMeters(a, b, lat) {
      const M_PER_DEG_LAT = 111320;
      const M_PER_DEG_LON = 111320 * Math.cos(lat * Math.PI / 180);
      const dlat = (a.lat - b.lat) * M_PER_DEG_LAT;
      const dlon = (a.lon - b.lon) * M_PER_DEG_LON;
      return Math.sqrt(dlat * dlat + dlon * dlon);
    }

    function pointInPolygon(pt, ring) {
      let inside = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const xi = ring[i][0], yi = ring[i][1];
        const xj = ring[j][0], yj = ring[j][1];
        if ((yi > pt.lat) !== (yj > pt.lat) && pt.lon < ((xj - xi) * (pt.lat - yi)) / (yj - yi) + xi) {
          inside = !inside;
        }
      }
      return inside;
    }

    function bikeInNoRideZone(bike, noRidePolys) {
      for (const geom of noRidePolys) {
        const polys = geom.type === 'MultiPolygon' ? geom.coordinates : [geom.coordinates];
        for (const poly of polys) {
          if (pointInPolygon(bike, poly[0])) return true;
        }
      }
      return false;
    }

    // ── Renderers ────────────────────────────────────────────────
    function renderBikes(bikes, stations, noRidePolys, cityLat) {
      bikeLayer.clearLayers();
      let nGreen = 0, nRed = 0, nInNoRide = 0;

      for (const b of bikes) {
        let minDist = Infinity;
        for (const s of stations) {
          const d = distMeters(b, s, cityLat);
          if (d < minDist) minDist = d;
        }
        const farFromStation = minDist > 20;
        const inNoRide = bikeInNoRideZone(b, noRidePolys);
        const isRed = farFromStation || inNoRide;

        if (isRed) nRed++; else nGreen++;
        if (inNoRide) nInNoRide++;

        let status;
        if (b.is_disabled) {
          status = 'Désactivé';
        } else if (b.is_reserved) {
          status = 'Réservé';
        } else {
          status = isRed ? 'Mal garé' : 'Bien garé';
        }

        const marker = L.marker([b.lat, b.lon], {
          icon: isRed ? bikeIconRed : bikeIconGreen,
        });

        const warning = [];
        if (farFromStation) warning.push('loin d\'une station');
        if (inNoRide) warning.push('en zone interdite');

        marker.bindTooltip(
          `<b>${status}</b>${warning.length ? ' ⚠' : ''}<br>ID : ${b.bike_id.slice(0,8)}…<br>Autonomie : ${(b.current_range_meters / 1000).toFixed(1)} km`,
        );

        marker.addTo(bikeLayer);
      }

      return { nGreen, nRed, nInNoRide };
    }

    function renderZones(geojson, boundaryName) {
      zoneLayer.clearLayers();
      let nNoRide = 0, nSpeed = 0;

      for (const feature of geojson.features) {
        const rules = feature.properties?.rules || [];
        const name  = feature.properties?.name;
        const hasSpeedLimit = rules.some(r => r.maximum_speed_kph != null);

        let style, tooltip, opts;

        if (name === boundaryName) {
          style = {
            color: '#000',
            weight: 2,
            fillColor: 'transparent',
            fillOpacity: 0,
          };
          tooltip = 'Zone de service';
          opts = { style, interactive: false };
        } else if (hasSpeedLimit) {
          nSpeed++;
          const kph = rules.find(r => r.maximum_speed_kph != null)?.maximum_speed_kph || '?';
          style = {
            color: '#ca8a04',
            weight: 2,
            fillColor: '#eab308',
            fillOpacity: 0.25,
          };
          tooltip = `⚠ Limite : ${kph} km/h`;
          opts = { style };
        } else {
          nNoRide++;
          style = {
            color: '#dc2626',
            weight: 2,
            fillColor: '#dc2626',
            fillOpacity: 0.2,
          };
          opts = { style };
          const labels = [];
          for (const r of rules) {
            if (!r.ride_allowed) labels.push('Circulation interdite');
            if (!r.ride_through_allowed) labels.push('Traversée interdite');
            //if (r.station_parking) labels.push('Stationnement uniquement');
          }
          tooltip = labels.join(' · ') || 'Zone réglementée';
        }

        const layer = L.geoJSON(feature, opts).addTo(zoneLayer);
        layer.bindTooltip(tooltip, {
          direction: 'center',
          className: 'leaflet-tooltip',
        });
      }

      return { nNoRide, nSpeed };
    }

    function renderStations(stations) {
      stationLayer.clearLayers();
      for (const s of stations) {
        const cap = s.vehicle_capacity?.dott_bicycle ?? 0;

        const marker = L.circle([s.lat, s.lon], {
          radius: 7.5,
          fillColor: '#22c55e',
          color: '#16a34a',
          weight: 2,
          fillOpacity: 0.3,
        });

        marker.bindTooltip(
          `<b>${s.name}</b><br>Capacité : ${cap}`,
          { direction: 'top', offset: [0, 0], opacity: 0.92 }
        );

        marker.addTo(stationLayer);
      }
    }

    // ── Load city ────────────────────────────────────────────────
    async function loadCity(cityKey) {
      currentCity = cityKey;
      const cfg = CITIES[cityKey];

      // Update map view
      map.setView(cfg.center, cfg.zoom);

      // Update selector
      document.getElementById('citySelect').value = cityKey;

      try {
        const [bikesRes, zonesRes, stationsRes] = await Promise.all([
          fetch(apiUrl(cityKey, 'free_bike_status')),
          fetch(apiUrl(cityKey, 'geofencing_zones')),
          fetch(apiUrl(cityKey, 'station_information')),
        ]);

        const bikesData    = await bikesRes.json();
        const zonesData    = await zonesRes.json();
        const stationsData = await stationsRes.json();

        // Extract no-ride zone polygons
        const noRidePolys = [];
        for (const f of zonesData.data.geofencing_zones.features) {
          const rules = f.properties?.rules || [];
          const hasSpeed = rules.some(r => r.maximum_speed_kph != null);
          if (!hasSpeed && f.properties?.name !== cfg.boundaryName) {
            noRidePolys.push(f.geometry);
          }
        }

        const bikeCounts = renderBikes(bikesData.data.bikes, stationsData.data.stations, noRidePolys, cfg.center[0]);
        const { nNoRide, nSpeed } = renderZones(zonesData.data.geofencing_zones, cfg.boundaryName);
        renderStations(stationsData.data.stations);

        updateTitle(cfg.name, bikeCounts.nGreen, bikeCounts.nRed, bikeCounts.nInNoRide);
        updateLegend(
          bikesData.data.bikes.length,
          stationsData.data.stations.length,
          nNoRide,
          nSpeed
        );
      } catch (err) {
        console.error('Failed to load data for', cityKey, err);
        updateLegend('?', '?', '?', '?');
        document.getElementById('title').querySelector('.main').textContent = cfg.name + ' : Erreur';
        document.getElementById('title').querySelector('.sub').textContent = '';
      }
    }

    // ── City selector ────────────────────────────────────────────
    document.getElementById('citySelect').addEventListener('change', function () {
      loadCity(this.value);
    });

    // ── Kick off ─────────────────────────────────────────────────
    loadCity('mons');
  </script>
</body>
</html>
